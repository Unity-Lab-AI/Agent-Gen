<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Gen</title>
<style>
  :root { --bg:#0b0b0f; --panel:#15151d; --line:#262633; --fg:#e8e6f0; --dim:#8c8aa0; --her:#ff4fa3; --you:#5ac8fa; --ok:#39d98a; --bad:#ff5c5c; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, Segoe UI, Roboto, sans-serif; height:100vh; display:grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr auto; }
  header { grid-column:1/3; display:flex; gap:14px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel) }
  header h1 { font-size:15px; margin:0; letter-spacing:.08em; text-transform:uppercase; color:var(--dim) }
  .light { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim) }
  .light i { width:9px; height:9px; border-radius:50%; background:#444; display:inline-block }
  .light.ok i { background:var(--ok) } .light.bad i { background:var(--bad) }
  #stage { position:relative; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 40%, #1b1626 0%, #0b0b0f 70%); overflow:hidden }
  #feed { display:none; max-height:92%; max-width:92%; border-radius:14px; box-shadow:0 0 90px #ff4fa333; background:#000 }
  body.live #feed { display:block } body.live #face, body.live #viseme { display:none }
  #face { width:min(60vh,520px); aspect-ratio:1; border-radius:50%; background:#1d1826; border:1px solid var(--line); display:flex; align-items:flex-end; justify-content:center; position:relative; box-shadow:0 0 80px #ff4fa322 }
  #face .eyes { position:absolute; top:38%; left:0; right:0; display:flex; justify-content:center; gap:22% }
  #face .eye { width:7%; aspect-ratio:1; background:#e8e6f0; border-radius:50%; transition:transform .08s }
  #face.blink .eye { transform:scaleY(.08) }
  #mouth { position:absolute; bottom:24%; width:22%; height:4%; background:var(--her); border-radius:40% 40% 50% 50%/50% 50% 60% 60%; transform-origin:center; transition:height .05s linear, width .05s linear }
  #viseme { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font:12px ui-monospace, monospace; color:var(--dim) }
  #state { position:absolute; top:12px; left:14px; font-size:12px; color:var(--dim) }
  #level { position:absolute; left:14px; bottom:14px; width:160px; height:6px; background:#222; border-radius:3px; overflow:hidden }
  #level i { display:block; height:100%; width:0; background:var(--you) }
  aside { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0 }
  #log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px }
  .msg { padding:8px 10px; border-radius:10px; max-width:95%; white-space:pre-wrap; word-break:break-word }
  .you { align-self:flex-end; background:#17313d; border:1px solid #1f4a5c } .her { align-self:flex-start; background:#3a1630; border:1px solid #5a2049 }
  .sys { align-self:center; color:var(--dim); font-size:12px } .dropped { opacity:.5; text-decoration:line-through }
  footer { grid-column:1/3; display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); background:var(--panel) }
  button { background:#22222e; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer } button.on { border-color:var(--her); color:var(--her) } button:disabled { opacity:.4 }
  input[type=text] { flex:1; background:#0f0f15; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px }
  #diag { font:11px ui-monospace, monospace; color:var(--dim); padding:6px 12px; border-top:1px solid var(--line); white-space:pre-wrap; max-height:110px; overflow:auto }
</style>
</head>
<body>
<header>
  <h1>Agent Gen</h1>
  <span class="light" id="l-hub"><i></i>hub</span>
  <span class="light" id="l-voice"><i></i>voice</span>
  <span class="light" id="l-speech"><i></i>speech</span>
  <span class="light" id="l-brain"><i></i>brain <b id="brain-name"></b></span>
  <span class="light" id="l-face"><i></i>face <b id="face-fps"></b></span>
  <span class="light" id="l-image"><i></i>image <b></b></span>
  <span style="flex:1"></span>
  <span class="light" id="l-mic"><i></i>mic</span>
</header>
<main id="stage">
  <div id="state">idle</div>
  <img id="feed" alt="">
  <div id="face">
    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    <div id="mouth"></div>
  </div>
  <div id="viseme">sil</div>
  <div id="level"><i></i></div>
</main>
<aside>
  <div id="log"></div>
  <div id="diag"></div>
</aside>
<footer>
  <button id="btn-mic">Start mic</button>
  <button id="btn-mute" disabled>Mute</button>
  <button id="btn-stop" title="Stop her mid-sentence">Shush</button>
  <input type="text" id="text" placeholder="or type to her and press Enter">
  <button id="btn-reset" title="Forget this conversation">Reset</button>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
